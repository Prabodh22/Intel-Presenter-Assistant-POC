    raw_text: >-
      Release Procedure

      Most of customers selects non-POR sensors, the so camera driver release is not part of the standard BKC

      Developed a separate Git infrastructure for non-POR sensor development

      Enabled daily builds for CCE sensors based on VTG baseline software

      Conducted independent HLK testing for sensor drivers

      Managed a separate release process for customized sensor solutions to the customer
